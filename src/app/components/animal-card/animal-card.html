<div class="card bg-base-100 w-96 shadow-sm">
  <div class="card-body">
    <h2 class="card-title">{{ animal().name }}</h2>
    <p>Age : {{ animal().age }} ans</p>
    <p>Niveau d'énergie : {{ animal().energyLevel }}%</p>
    <progress class="progress w-56" [value]="animal().energyLevel" max="100"></progress>
    <div class="card-actions justify-end">
      <button class="btn btn-primary">Adopter</button>
    </div>
  </div>
</div>
