<div class="text-center space-y-2">
    <h1 class="text-4xl font-extrabold text-primary">{{ title }}</h1>
</div>

<div class="card bg-base-200 shadow-lg border border-base-300">
    <div class="card-body space-y-4">
      <h2 class="card-title text-secondary">Résumé de la commande</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 my-2">
        <div class="space-y-4 bg-base-100 p-4 rounded-xl border border-base-300">
          <div>
            <h2 class="card-title text-secondary">1. Configuration de la commande</h2>
          </div>

          <div>
            <label class="label text-s font-bold">Quantité d'articles</label>
            <div class="flex items-center gap-3">
              <button [disabled]="quantity() === 0" class="btn btn-sm btn-outline btn-error" (click)="decrementQuantity()">-</button>
              <span class="font-bold text-lg w-8 text-center">{{ quantity() }}</span>
              <button class="btn btn-sm btn-outline btn-success" (click)="incrementQuantity()">+</button>
              <label class="label text-xs font-bold">( {{ unitPrice() }} € / unité)</label>
            </div>
          </div>

          <div>
            <label class="label text-s font-bold">Code Promo/Remise</label>
            <div class="flex items-center gap-3">
              <button (click)="setDiscount(0)" [class.btn-primary]="discountPercent() === 0" class="btn">Aucune (0%)</button>
              <button (click)="setDiscount(10)" [class.btn-primary]="discountPercent() === 10" class="btn">-10%</button>
              <button (click)="setDiscount(20)" [class.btn-primary]="discountPercent() === 20" class="btn">-20%</button>
            </div>
          </div>

          <div>
            <label class="label text-s font-bold">Livraison express 24h (Supplément fixe de 12€)</label>
            <input (change)="toggleExpressShipping()" [checked]="isExpressShipping()" type="checkbox" class="toggle toggle-primary" />
          </div>
        </div>

        <div class="space-y-3 bg-base-100 p-4 rounded-xl border border-base-300 flex flex-col justify-between">
          <div class="space-y-2">
            <div class="flex justify-between text-sm">
              <span>Prix brut :</span>
              <span class="font-semibold">0 €</span>
            </div>

            <div class="flex justify-between text-sm text-warning">
              <span>Remise (dès 100 €) :</span>
              <span class="font-semibold">- 0 €</span>
            </div>

            <div class="divider my-1"></div>

            <div class="flex justify-between text-base font-bold text-primary">
              <span>Total Final:</span>
              <span class="text-xl">100 €</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
