<div class="text-center space-y-2">
    <h1 class="text-4xl font-extrabold text-primary">{{ title }}</h1>
</div>

<div class="flex flex-wrap gap-2">
    @for (a of animals(); track a.id) {
        <app-animal-card
          [animal]="a"
          (adoptStatusChange)="handleToggleAdoptStatus($event)"
          (energyLevelChange)="handleChangeEnergyLevel($event)">
        </app-animal-card>
    }
</div>
